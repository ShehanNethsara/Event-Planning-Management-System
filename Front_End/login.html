<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — EventPro</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body>
<div class="auth-page">
  <div class="auth-vis">
    <img src="https://images.unsplash.com/photo-1519167758481-83f550bb49b3?q=80&w=1200&auto=format&fit=crop" alt="Event">
    <div class="auth-vis-ov">
      <div class="auth-quote">"Every great event begins with a single, inspired decision."</div>
      <div style="font-size:.75rem;color:rgba(255,255,255,.45);margin-top:10px;">— EventPro</div>
    </div>
  </div>
  <div class="auth-panel">
    <div class="auth-inner">
      <div class="auth-logo">EventPro</div>
      <p class="auth-sub">Welcome back. Sign in to continue.</p>
      <div id="err" style="display:none;background:rgba(240,96,96,.1);border:1px solid rgba(240,96,96,.22);border-radius:8px;padding:11px 14px;font-size:.83rem;color:var(--red);margin-bottom:15px;"></div>
      <div class="fg"><label class="fl">Email Address</label><input type="email" id="email" class="fc" placeholder="your@email.com"></div>
      <div class="fg"><label class="fl">Password</label>
        <div style="position:relative;"><input type="password" id="pwd" class="fc" placeholder="••••••••" style="padding-right:42px;">
        <button onclick="togglePwd()" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;"><i class="fas fa-eye" id="eye"></i></button></div>
      </div>
      <button class="btn btn-gold w100 btn-lg mt8" id="lbtn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Sign In</button>
      <div class="divider">or continue with demo</div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <button onclick="demo('admin@eventpro.com','admin123','ADMIN')" class="btn btn-outline" style="justify-content:flex-start;"><i class="fas fa-shield-alt" style="color:var(--blue)"></i> Admin — admin@eventpro.com</button>
        <button onclick="demo('client@eventpro.com','client123','CLIENT')" class="btn btn-outline" style="justify-content:flex-start;"><i class="fas fa-user" style="color:var(--green)"></i> Client — client@eventpro.com</button>
        <button onclick="demo('vendor@eventpro.com','vendor123','STAFF')" class="btn btn-outline" style="justify-content:flex-start;"><i class="fas fa-store" style="color:var(--gold)"></i> Vendor — vendor@eventpro.com</button>
      </div>
      <p style="font-size:.83rem;color:var(--text3);text-align:center;margin-top:22px;">No account? <a href="register.html" style="color:var(--gold);">Create one free</a></p>
    </div>
  </div>
</div>
<div id="toast-cnt"></div>
<script src="js/app.js"></script>
<script>
function togglePwd(){const p=document.getElementById('pwd'),i=document.getElementById('eye');p.type=p.type==='password'?'text':'password';i.className=p.type==='password'?'fas fa-eye':'fas fa-eye-slash';}
async function doLogin(){
  const email=document.getElementById('email').value.trim(),pwd=document.getElementById('pwd').value,btn=document.getElementById('lbtn'),err=document.getElementById('err');
  err.style.display='none';
  if(!email||!pwd){err.textContent='Please fill in all fields.';err.style.display='block';return;}
  btn.disabled=true;btn.innerHTML='<div class="sp"></div> Signing in...';
  try{
    const d=await api('POST','/auth/login',{email,password:pwd});
    localStorage.setItem('token',d.token);
    localStorage.setItem('userRole',(d.role||'CLIENT').toUpperCase());
    localStorage.setItem('userEmail',email);
    localStorage.setItem('userId',d.userId||d.id||'');
    localStorage.setItem('userName',d.name||email.split('@')[0].toUpperCase());
    toast('Welcome back, '+(d.name||email.split('@')[0])+'!','success');
    setTimeout(()=>{const r=(d.role||'').toUpperCase();if(r==='ADMIN')location.href='adminDashboard.html';else if(r==='STAFF')location.href='vendorDashboard.html';else location.href='userDashboard.html';},700);
  }catch(e){
    err.textContent=e.message||'Invalid credentials. Please try again.';err.style.display='block';
    btn.disabled=false;btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Sign In';
  }
}
function demo(email,pwd,role){document.getElementById('email').value=email;document.getElementById('pwd').value=pwd;doLogin();}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script></body></html>
