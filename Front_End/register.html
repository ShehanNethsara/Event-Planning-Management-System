<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — EventPro</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body>
<div class="auth-page">
  <div class="auth-vis">
    <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?q=80&w=1200&auto=format&fit=crop" alt="Event">
    <div class="auth-vis-ov">
      <div class="auth-quote">"The finest events are born from the finest planning."</div>
      <div style="font-size:.75rem;color:rgba(255,255,255,.45);margin-top:10px;">— EventPro</div>
    </div>
  </div>
  <div class="auth-panel">
    <div class="auth-inner">
      <div class="auth-logo">EventPro</div>
      <p class="auth-sub">Create your account and start planning today.</p>
      <div id="err" style="display:none;background:rgba(240,96,96,.1);border:1px solid rgba(240,96,96,.22);border-radius:8px;padding:11px 14px;font-size:.83rem;color:var(--red);margin-bottom:15px;"></div>
      <div id="ok" style="display:none;background:rgba(34,201,139,.1);border:1px solid rgba(34,201,139,.22);border-radius:8px;padding:11px 14px;font-size:.83rem;color:var(--green);margin-bottom:15px;"></div>
      <div class="fg"><label class="fl">Full Name</label><input type="text" id="name" class="fc" placeholder="Your full name"></div>
      <div class="fg"><label class="fl">Email Address</label><input type="email" id="email" class="fc" placeholder="your@email.com"></div>
      <div class="fg"><label class="fl">Password</label><input type="password" id="pwd" class="fc" placeholder="Minimum 6 characters"></div>
      <div class="fg"><label class="fl">Account Type</label>
        <select id="role" class="fc">
          <option value="CLIENT">Client — I want to book events</option>
          <option value="STAFF">Vendor — I provide services</option>
        </select>
      </div>
      <button class="btn btn-gold w100 btn-lg" id="rbtn" onclick="doReg()"><i class="fas fa-user-plus"></i> Create Account</button>
      <p style="font-size:.83rem;color:var(--text3);text-align:center;margin-top:20px;">Already have an account? <a href="login.html" style="color:var(--gold);">Sign in</a></p>
    </div>
  </div>
</div>
<div id="toast-cnt"></div>
<script src="js/app.js"></script>
<script>
async function doReg(){
  const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),pwd=document.getElementById('pwd').value,role=document.getElementById('role').value;
  const btn=document.getElementById('rbtn'),err=document.getElementById('err'),ok=document.getElementById('ok');
  err.style.display='none';ok.style.display='none';
  if(!name||!email||!pwd){err.textContent='Please fill all fields.';err.style.display='block';return;}
  if(pwd.length<6){err.textContent='Password must be at least 6 characters.';err.style.display='block';return;}
  btn.disabled=true;btn.innerHTML='<div class="sp"></div> Creating...';
  try{
    await api('POST','/auth/register',{name,email,password:pwd,role});
    ok.textContent='Account created successfully! Redirecting to login...';ok.style.display='block';
    toast('Welcome to EventPro!','success');
    setTimeout(()=>location.href='login.html',1500);
  }catch(e){
    err.textContent=e.message||'Registration failed. Please try again.';err.style.display='block';
    btn.disabled=false;btn.innerHTML='<i class="fas fa-user-plus"></i> Create Account';
  }
}
</script></body></html>
